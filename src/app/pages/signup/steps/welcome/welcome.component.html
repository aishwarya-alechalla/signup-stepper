<div class="welcome-container">

  <!-- Logo -->
  <img
    src="assets/images/othisis-logo.svg"
    alt="Othisis Medtech"
    class="logo"
  />

  <!-- Heading -->
  <h1 class="title">Welcome to Othisis!</h1>

  <!-- Description -->
  <p class="description">
    Just speak, and Othisis turns your conversations into clean, structured
    notes — so you can focus more on your patients, not paperwork.
  </p>

  <!-- Sub heading -->
  <h2 class="subtitle">
    Let’s get started, how should we address you?
  </h2>

  <!-- FORM -->
  <div class="form">

    <!-- First Name -->
    <label class="label">First Name*</label>
    <input
      type="text"
      placeholder="John"
      class="input"
    />

    <!-- Last Name -->
    <label class="label">Last Name*</label>
    <input
      type="text"
      placeholder="Doe"
      class="input"
    />

    <!-- Mobile Number -->
    <label class="label">Mobile Number*</label>

    <div class="mobile-row">

      <!-- FLAG + CODE (IMAGE ONLY, USA ONLY) -->
      <div class="country-code">
        <img
          src="assets/images/country-flag.svg"
          alt="US Flag"
          class="flag"
        />
        <span class="dial-code">+1</span>
      </div>

      <input
        type="tel"
        placeholder="222-333-4444"
        class="input mobile-input"
      />
    </div>

  </div>

  <!-- Next Button -->
  <button class="next-btn">Next</button>

</div>
